app:
  name: "auth-service"
  version: "0.0.1"
  description: "Demo project for Spring Boot"
  artifact: "auth-service"
  group: "com.sila"

spring:
  application:
    name: "auth-service"

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:demo-app }
            client-secret: ${KEYCLOAK_CLIENT_SECRET:rdGLEw4CColzVYbsUD7wjmicKNOve8pX }
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/demo-realm}
            user-name-attribute: preferred_username

server:
  port: ${APPLICATION_PORT:9000}

logging:
  level:
    org:
      springframework:
        security:
          oauth2: DEBUG